<h2 style="font-family:sans-serif;color:#222;">ROOTIVE 利益管理 メールアドレスの確認</h2>
<p style="font-family:sans-serif;color:#222;">
  {{ .Email }} を ROOTIVE 利益管理システムのログイン用メールアドレスとして登録します。<br>
  下のボタンを押して確認を完了してください。
</p>
<p style="margin:24px 0;">
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next={{ .RedirectTo }}"
     style="display:inline-block;padding:12px 24px;background:#1f5eff;color:#fff;text-decoration:none;border-radius:6px;font-family:sans-serif;font-weight:bold;">
    メールアドレスを確認する
  </a>
</p>
<p style="font-family:sans-serif;color:#555;font-size:13px;">
  ボタンが押せない場合は、次の URL をブラウザに貼り付けてください。<br>
  {{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next={{ .RedirectTo }}
</p>
<p style="font-family:sans-serif;color:#555;font-size:13px;">
  心当たりがない場合は、このメールを無視してください。
</p>
