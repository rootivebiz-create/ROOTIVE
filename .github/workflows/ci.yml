# 品質ゲート：型チェック・Lint・単体テスト・SQL 結合テスト・本番ビルド
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    name: typecheck / lint / test / test:sql / build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 54329:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:54329/postgres
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-anon-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: psql をインストール
        run: sudo apt-get update -qq && sudo apt-get install -y -qq postgresql-client >/dev/null
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:sql
      - run: npm run build:sql && git diff --exit-code -- supabase/setup_all.sql
      - run: npm run build
